<div id="app" class="x x1"><div class="cmd"><span class="k">BERTH</span><span class="t">부산항 지연 조기경보 · 신항</span><span class="m">불러오는 중…</span></div></div>
<script>

"use strict";
// v2.6 사용자 화면: 시안 3-5번 레이아웃 + 1번 색감(검정·앰버). 실데이터 API 연결
//   /v25/board (예측·최근 접안·정확도·일별 오차), /predict/next-day (80% 범위·작업시간·반입 마감·다음 항구), /v25/impact (손실·절감)
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>{const[a,b]=s.split(' ');const[Y,M,Dd]=a.split('-').map(Number);const[h,m]=(b||'00:00').split(':').map(Number);return new Date(Y,M-1,Dd,h,m)};
let T0=new Date(),D0=new Date(),HZ=48,D=null,startH=0;
const hrs=s=>(P(s)-T0)/36e5;
const mn=h=>Math.round(h*60);
const sg=h=>{const m=mn(h);return(m>0?'+':m<0?'−':'±')+Math.abs(m)};

function view(){

  Object.entries(byRow).forEach(([k,L])=>{L.sort((p,q)=>p.a-q.a);const ends=[];
    L.forEach(it=>{lane[it.s.id]=0});nL[k]=1;
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){if(L[j].a<L[i].b){ovIds.add(L[i].s.id);ovIds.add(L[j].s.id);ovH[L[j].s.id]=Math.max(ovH[L[j].s.id]||0,Math.min(L[i].b,L[j].b)-L[j].a);ovE[L[j].s.id]=Math.max(ovE[L[j].s.id]||0,Math.min(L[i].b,L[j].b));ovZones.push({k,a:L[j].a,b:Math.min(L[i].b,L[j].b),n1:L[i].s.name,n2:L[j].s.name,t:L[i].s.t})}}});
  const top=head+histH,rowY={};let acc=top;rows.forEach(r=>{rowY[r]=acc;acc+=rh*(nL[r]||1)});const H=acc+18;
  let g=`<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}"><defs><pattern id="ovhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(0,0,0,.35)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,0,0,.7)" stroke-width="3"/></pattern></defs>`;
  for(let k=0;k<4;k++){const a=(D0.getTime()+k*864e5-T0)/36e5,b=a+24;const x1=X(Math.max(a,startH)),x2=X(Math.min(b,HZ));if(x2<=x1)continue;if(k%2)g+=`<rect class="band" x="${x1}" y="0" width="${x2-x1}" height="${H}"/>`;
    if(a>startH)g+=`<line class="dayl" x1="${X(a)}" x2="${X(a)}" y1="0" y2="${H}"/>`;
    const dd=new Date(D0.getTime()+k*864e5);g+=`<text class="hd" x="${x1+6}" y="13">${['오늘','내일','모레','글피'][k]} ${dd.getMonth()+1}/${dd.getDate()}</text>`}
  g+=`<rect class="cur" x="${X(startH)}" y="${head-14}" width="${hp}" height="${H-head+14}"/>`;
  for(let i=0;i<=span;i++){const h=startH+i,x=X(h),clock=(T0.getHours()+i)%24,six=clock%6===0;
    g+=`<line class="${six?'gl6':'gl'}" x1="${x}" x2="${x}" y1="${head-12}" y2="${H}"/>`;
    if(i<span)g+=`<text x="${x+hp/2}" y="${head-2}" text-anchor="middle" ${six?'class="hd"':''}>${clock}</text>`}
  if(o.hist){const cnt=new Array(Math.ceil(span)).fill(0);ships.filter(s=>!off(s.t)).forEach(s=>{const i=Math.floor(s.h-startH);if(i>=0&&i<cnt.length)cnt[i]++});const mx=Math.max(1,...cnt);
    cnt.forEach((c,i)=>{if(!c)return;const bh=(c/mx)*(histH-14);g+=`<rect class="hist" x="${X(startH+i)+2}" y="${head+histH-4-bh}" width="${hp-4}" height="${bh}"/><text class="histn" x="${X(startH+i)+hp/2}" y="${head+histH-6-bh}" text-anchor="middle">${c}</text>`});
    g+=`<text x="4" y="${head+histH-6}">시간당 접안</text>`}
  rows.forEach((r,i)=>{const y=rowY[r],rhh=rh*(nL[r]||1),t=r.split(' ')[0];if(v.sel&&v.sel.t+' '+v.sel.berth===r)g+=`<rect class="rowsel" x="0" y="${y}" width="${Wd}" height="${rhh}"/>`;if(ovZones.some(z=>z.k===r&&z.b>startH))g+=`<rect class="rowov ${off(t)?'dimz':''}" x="0" y="${y}" width="${Wd}" height="${rhh}"/><rect class="rowovl ${off(t)?'dimz':''}" x="0" y="${y}" width="4" height="${rhh}"/>`;if(off(t))g+=`<rect class="rowoff" x="0" y="${y}" width="${Wd}" height="${rhh}"/>`;g+=`<text class="rl ${off(t)?'dim':''}" x="6" y="${y+rhh/2+4}" data-act="term" data-t="${esc(t)}"><title>${esc(t)}만 보기</title>${esc(r)}</text><line class="gl" x1="0" x2="${Wd}" y1="${y+rhh}" y2="${y+rhh}"/>`});
  let labels='';
  ships.forEach(s=>{const y=rowY[s.t+' '+s.berth]+(lane[s.id]||0)*rh+4,bh=rh-8,len=Math.max(1,s.work||2),x=X(s.h),w=Math.min(len*hp,Wd-x-2),xp=X(s.hp);
    g+=`<g data-act="sel" data-id="${esc(s.id)}" data-t="${esc(s.t)}" class="${v.sel===s?'sel':''} ${off(s.t)?'dim':''}"><title>${esc(s.name)} · 예정 ${fdt(s.planned)} → 예측 ${fdt(s.predicted)} (${sgm(s.d)}) · 작업 ${s.work??'?'}시간</title>`;
    g+=`<rect class="ghost" x="${xp}" y="${y-1}" width="${Math.max(4,Math.min(len*hp,Wd-xp-2))}" height="${bh+2}" rx="2"/>`;
    if(Math.abs(s.d)>0.05)g+=`<line class="con" x1="${xp}" x2="${x}" y1="${y+bh/2}" y2="${y+bh/2}"/>`;
    g+=`<rect class="bar g${s.g} ${ovIds.has(s.id)?'ov':''}" x="${x}" y="${y}" width="${Math.max(w,4)}" height="${bh}" rx="2"/>`;
    const lx=ovE[s.id]?Math.min(X(ovE[s.id]),x+w):x,lw2=x+w-lx,lab=`${s.name} ${sgm(s.d)}`,fits=lw2>lab.length*6.6+8,fitsN=lw2>s.name.length*6.6+8;
    labels+=`<text class="bl ${off(s.t)?'dimt':''}" x="${lx+5}" y="${y+bh/2+4}">${esc(fits?lab:fitsN?s.name:'')}</text>`;
    if(!fitsN)labels+=`<text class="${off(s.t)?'dimt':''}" x="${x+Math.max(w,4)+4}" y="${y+bh/2+4}" style="fill:var(--fg)">${esc(lab)}</text>`;
    g+=`</g>`});
  // 겹친 구간: 막대 위에 옅은 빗금 + 앰버 점선 테두리, 그 위에 배 이름, 맨 위에 겹친 시간
  ovZones.forEach(z=>{const x1=X(Math.max(z.a,startH)),x2=Math.min(X(z.b),Wd-2);if(x2>x1)g+=`<rect class="ovz ${off(z.t)?'dimz':''}" x="${x1}" y="${rowY[z.k]+3}" width="${x2-x1}" height="${rh-6}"/>`});
  g+=labels;
  ovZones.forEach(z=>{const x1=X(Math.max(z.a,startH)),x2=Math.min(X(z.b),Wd-2);if(x2<=x1)return;const hh=z.b-z.a;
    g+=`<g class="ovg ${off(z.t)?'dim':''}"><title>같은 선석 겹침 ${hh.toFixed(1)}시간: ${esc(z.n1)} ↔ ${esc(z.n2)}</title><rect class="ovframe" x="${x1}" y="${rowY[z.k]+3}" width="${x2-x1}" height="${rh-6}"/><text class="ovt" x="${(x1+x2)/2}" y="${rowY[z.k]+rh/2+4}" text-anchor="middle">${hh.toFixed(1)}h</text></g>`});
  g+=`<line class="now" x1="${X(0)}" x2="${X(0)}" y1="${head-14}" y2="${H}"/><text class="nowt" x="${X(0)+4}" y="${H-4}">지금 ${D.as_of.slice(11,16)}</text></svg>`;
  const ovs=ovZones.filter(z=>z.b>startH).sort((p,q)=>p.a-q.a),hm=h=>{const d=new Date(T0.getTime()+h*36e5);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  const ovl=ovs.length?`<div class="ovl"><span class="hd0">같은 선석 겹침 ${ovs.length}건</span>${ovs.map(z=>{const c=off(z.t)?' dim':'';return `<span class="k${c}">■ ${esc(z.k)}</span><span class="n${c}">${esc(z.n1)} ↔ ${esc(z.n2)}</span><span class="w${c}">${hm(z.a)} ~ ${hm(z.b)}</span><span></span><span class="h${c}">겹침 ${(z.b-z.a).toFixed(1)}시간</span>`}).join('')}</div>`:'';
  return `${ovl}<div class="hz">${g}</div><div class="lg"><span><i style="background:var(--g0)"></i>막대 = 예측 접안 ~ 예측 작업 종료</span><span><i style="border:1px dashed var(--mut)"></i>점선 = 터미널 예정</span><span><i style="background:var(--ac)"></i>세로선 = 지금</span>${o.hist?'<span><i style="background:var(--ac);opacity:.55"></i>위 막대 = 시간당 접안 척수</span>':''}<span><i style="background:repeating-linear-gradient(45deg,#4ee06a 0 3px,#000 3px 6px);outline:2px solid var(--ac)"></i>빗금 칸 = 같은 선석에서 겹치는 시간</span><span>1칸 = 1시간 · 굵은 선 6시간</span></div>`;
}
function spark(w,h){
  const d=D.days.filter(x=>x.win&&x.win.mae!=null);if(d.length<2)return '<p class="na">기록 부족</p>';
  const mx=Math.max(...d.map(x=>Math.max(x.win.mae,x.win.term_mae)))*1.1,lb=28;
  const X=i=>lb+i*(w-lb-4)/(d.length-1),Y=v=>h-14-(v/mx)*(h-22);
  const line=k=>d.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x.win[k]).toFixed(1)}`).join('');
  let s=`<svg class="sp" viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="display:block">`;
  [0,15,30].forEach(m=>{if(m/60>mx)return;const y=Y(m/60);s+=`<line class="ax" x1="${lb}" x2="${w}" y1="${y}" y2="${y}"/><text x="0" y="${y+3}">${m}분</text>`});
  s+=`<text x="${lb}" y="${h-1}">${d[0].iso.slice(5)}</text><text x="${w}" y="${h-1}" text-anchor="end">${d[d.length-1].iso.slice(5)}</text>`;
  return s+`<path class="t" d="${line('term_mae')}"/><path class="m" d="${line('mae')}"/></svg>`;
}
function accBlock(v){
  const w=v.win||{};
  return `<div class="body"><div class="two"><div><span>모델</span><b style="color:var(--ac)">${w.mae==null?'—':mn(w.mae)+'분'}</b></div><div><span>터미널 예정</span><b>${w.term_mae==null?'—':mn(w.term_mae)+'분'}</b></div><div><span>판정</span><b class="${w.drift?'g2':'g0'}">${w.n==null?'—':w.drift?'드리프트':w.full?'정상':'수집 중'}</b></div></div>
  <div class="acc">${['HJNC','PNIT','BNCT'].map(k=>{const t=(D.terminals[k]||{}).all||{};return `<span>${k}</span><div class="bar2"><i style="width:${pct(t.term_in30)}%"></i><b style="width:${pct(t.in30)}%"></b></div><span>${pct(t.term_in30)}→<b>${pct(t.in30)}%</b></span>`}).join('')}</div>
  <p class="cap" style="margin-top:8px">30분 안 적중률 (회색 터미널 예정 · 앰버 모델) · 위 숫자는 최근 ${D.wdays}일 평균 오차${w.n!=null?` (${w.n}척)`:''}</p>${leadTbl()}</div>`;
}
function leadTbl(){
  const L=D.lead&&D.lead[ST.term];if(!L||!L.leads||!L.leads.length)return '';
  const order=['48h','24h','10h','6h','final'],rows=order.map(k=>L.leads.find(x=>x.lead===k)).filter(Boolean);
  const nm={'48h':'48시간 전','24h':'24시간 전','10h':'반입 마감 (10시간 전)','6h':'6시간 전','final':'최종 (1시간 전)'};
  return `<div class="cap" style="margin-top:12px">예측 시점별 정확도 · ${TNAME[ST.term]} · ${L.period_from}~ 운영 구간</div><table class="rc lead"><thead><tr><th>시점</th><th class="n">척수</th><th class="n">모델 오차</th><th class="n">모델 30분 안</th><th class="n">터미널 예정 오차</th><th class="n">예정 30분 안</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${nm[r.lead]}${r.plan_known?'':' *'}</td><td class="n">${r.n||'-'}</td><td class="n" style="color:var(--ac)">${r.mae_h==null?'-':mn(r.mae_h)+'분'}</td><td class="n">${pct(r.in30)}%</td><td class="n">${r.terminal_mae_h==null?'기록 없음':mn(r.terminal_mae_h)+'분'}</td><td class="n">${r.terminal_in30==null?'—':pct(r.terminal_in30)+'%'}</td></tr>`).join('')}</tbody></table><p class="cap" style="margin-top:4px">* 그 시점 터미널 예정은 기록이 없어 반입 마감 시점 예정을 기준으로 계산 (실제보다 좋게 나올 수 있음). 시점별 엑셀이 쌓이면 바로잡음</p>`;
}
function recentTbl(v){
  if(!v.recent.length)return `<p class="na" style="padding:10px 12px">최근 24시간 접안 없음</p>`;
  return `<div class="tblw" style="--tblh:220px"><table class="rc"><thead><tr><th>배</th><th>터미널</th><th class="n">예측</th><th class="n">실제</th><th class="n">모델 오차</th><th class="n">예정 오차</th></tr></thead><tbody>${v.recent.map(s=>`<tr><td><span class="nm">${esc(s.name)}</span>${s.working?' <span class="as">작업 중</span>':''}</td><td>${s.terminal} ${esc(s.berth)}</td><td class="n">${sg(s.delay)}</td><td class="n">${sg(s.actual)}</td><td class="n">${Math.abs(mn(s.actual)-mn(s.delay))}분</td><td class="n">${Math.abs(mn(s.actual))}분</td></tr>`).join('')}</tbody></table></div>`;
}
function impBlock(){
  const im=D.impact;
  if(!im)return pnl('예상 손실·절감 <span class="as">가정</span>','/v25/impact 응답 없음',`<div class="body"><div class="imp2"><div><label>선사 손실</label><b>— 원</b></div><div><label>배 대기 비용</label><b>— 원</b></div><div><label>절감 가능액</label><b>— 원</b></div><div><label>노는 작업조</label><b>—</b></div></div></div>`);
  const t=im.totals||{},acts=(im.actions||[]).filter(a=>ST.term==='ALL'||a.terminal===ST.term).slice(0,5),stf=(im.staffing||[]).filter(a=>ST.term==='ALL'||a.terminal===ST.term).slice(0,9);
  return pnl(`예상 손실·절감 <span class="as">가정</span>`,`다음 ${HZ}시간 · 신항 전체`,`<div class="body"><div class="imp2">
  <div><label>선사 손실</label><b>${won(t.carrier_loss_krw)}</b></div><div><label>배 대기 비용</label><b>${won(t.vessel_wait_krw)}</b><span class="cap">야간 할증 ${won(t.night_surcharge_krw)}</span></div><div><label>절감 가능액</label><b style="color:var(--ac)">${won(t.possible_saving_krw)}</b></div><div><label>노는 작업조</label><b>${t.labor_idle_gang_h??'—'}<small>개 조</small></b><span class="cap">절감 가능 ${t.possible_saving_gang_h??'—'}개 조</span></div></div>
  <div class="imgrid"><div><div class="cap">조치 (절감액 순)</div>${acts.length?acts.map(a=>`<div class="adv"><b>${esc(a.vessel||'')} · ${esc(a.who)}${a.reference_only?' <span class="as">참고</span>':''}</b>${esc(a.what)}${a.saving_krw?` <span style="color:var(--ac)">${won(a.saving_krw)}</span>`:''}</div>`).join(''):'<p class="na">조치 없음</p>'}</div>
  <div><div class="cap">시간대별 작업조 (계획 → 예측 필요)</div>${stf.length?`<table class="rc"><tbody>${stf.map(r=>`<tr><td>${r.terminal}</td><td>${esc(r.from)}~${esc(r.to.slice(-5))}</td><td class="n">${r.planned_gangs}→<b>${r.predicted_gangs}</b></td><td class="n ${r.delta<0?'g1':'g2'}">${r.delta>0?'+':''}${r.delta}</td></tr>`).join('')}</tbody></table><p class="cap">${esc(stf[0].advice||'')}</p>`:'<p class="na">변동 없음</p>'}</div></div></div>`,'imp');
}
function render(){
  const v=view();
  $('app').innerHTML=`${topbar(v)}<div class="wrap"><div class="main">
    <div class="col">${pnl('시간대별 접안 일정','선석별 · 1칸 1시간 · 막대를 누르면 상세',hourly(v,{hist:true}))}${pnl(`접안 예정 ${HZ}시간`,sortBtns(),tbl(v),'grow')}</div>
    ${pnl('선박 상세',v.sel?esc(v.sel.id):'',detail(v),'side')}</div>
    <div class="b3">${pnl('정확도',`최근 ${D.wdays}일`,accBlock(v))}${pnl('30일 평균 오차 추이','앰버 모델 · 점선 예정',`<div class="body">${spark(420,150)}</div>`)}${pnl('최근 24시간 접안 · 예측 vs 실제','분',recentTbl(v))}</div>
    ${impBlock()}</div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='term'){ST.term=(a.tagName==='text'&&ST.term===a.dataset.t)?'ALL':a.dataset.t;ST.sel=null}   // 일정표 줄 이름을 다시 누르면 전체로
  else if(a.dataset.act==='sort'){ST.sort=a.dataset.k;ST.sel=null}
  else if(a.dataset.act==='sel'){if(a.dataset.t&&ST.term!=='ALL'&&a.dataset.t!==ST.term)ST.term=a.dataset.t;ST.sel=a.dataset.id}   // 어두운 막대를 누르면 그 터미널로 전환
  render()});
document.addEventListener('keydown',e=>{const i=['F1','F2','F3','F4'].indexOf(e.key);if(i>=0){e.preventDefault();ST.term=TERMS[i];ST.sel=null;render()}});
async function boot(){try{await load();render()}catch(e){$('app').innerHTML=`<div class="cmd"><span class="k">BERTH</span><span class="t">부산항 지연 조기경보 · 신항</span></div><p style="padding:20px">서버에 연결하지 못했습니다 (${esc(e.message)}). 모델 서버의 /early-warning 주소로 열어 주세요.</p>`}}
boot();setInterval(()=>{load().then(render).catch(()=>{})},120000);

</script>
